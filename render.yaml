services:
  - type: web
    name: job-search-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      # Bulk-apply fix: the runtime looked for chromium_headless_shell-1248
      # and missed it. PLAYWRIGHT_BROWSERS_PATH pins a shared location used by
      # BOTH build and runtime (also set in envVars below).
      export PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.pw-browsers
      playwright install chromium --with-deps || playwright install chromium
    # Fix: default sync worker timeout (30s) kills the worker mid-request when
    # an LLM call chains Anthropic(401)->OpenRouter fallback, or when the
    # LinkedIn scraper scores many cards (observed WORKER TIMEOUT + SIGKILL on
    # /profile/import and /discover). 600s covers the worst chains; the
    # scraper now also caps per-card scoring (LINKEDIN_MAX_DETAILS=6).
    # NOTE: if Render does not pick up the new startCommand on an existing
    # service, apply "Sync" in the dashboard OR set env var
    # GUNICORN_TIMEOUT=600 and change the start command once manually.
    startCommand: gunicorn agent.app:app --timeout 600 --graceful-timeout 30
    envVars:
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.pw-browsers
      - key: PORT
        value: 10000
      - key: GUNICORN_TIMEOUT
        value: "600"
      - key: LINKEDIN_MAX_DETAILS
        value: "6"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: PYTHONPATH
        value: .

  - type: web
    name: job-search-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Fix: fromService 'host' resolves to Render's INTERNAL hostname
      # (e.g. job-search-backend:10000), which the browser cannot reach.
      # The frontend needs the PUBLIC backend URL (api.ts prepends https://).
      - key: NEXT_PUBLIC_API_URL
        value: https://job-search-agent-tfd1.onrender.com
