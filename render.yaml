services:
  - type: web
    name: job-search-backend
    env: python
    buildCommand: |
      pip install -r requirements.txt
      playwright install chromium
    # Fix: default sync worker timeout (30s) kills the worker mid-request when
    # an LLM call chains Anthropic(401)->OpenRouter fallback (observed WORKER
    # TIMEOUT + SIGKILL on /profile/import). 180s covers the fallback chain.
    startCommand: gunicorn agent.app:app --timeout 180 --graceful-timeout 30
    envVars:
      - key: PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: PYTHONPATH
        value: .

  - type: web
    name: job-search-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # Fix: fromService 'host' resolves to Render's INTERNAL hostname
      # (e.g. job-search-backend:10000), which the browser cannot reach.
      # The frontend needs the PUBLIC backend URL (api.ts prepends https://).
      - key: NEXT_PUBLIC_API_URL
        value: https://job-search-agent-tfd1.onrender.com
