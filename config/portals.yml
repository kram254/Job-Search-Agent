title_filter:
  positive:
    - engineer
    - developer
    - scientist
    - architect
    - ml
    - ai
    - machine learning
    - python
    - backend
    - platform
    - agent
    - llm
    - automation
  negative:
    - intern
    - director
    - vp
    - chief
    - president
    - legal
    - finance
    - accounting
    - recruiter
    - hr
  seniority_boost:
    - senior
    - staff
    - principal
    - lead

search_queries:
  - query: "AI engineer remote"
    sources: [linkedin, indeed]
  - query: "LLM engineer python remote"
    sources: [linkedin, indeed]
  - query: "agentic AI automation python"
    sources: [linkedin, indeed]
  - query: "ML platform engineer remote"
    sources: [linkedin, indeed]
