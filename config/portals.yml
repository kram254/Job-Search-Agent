title_filter:
  positive:
    - engineer
    - developer
    - scientist
    - architect
    - ml
    - ai
    - machine learning
    - python
    - backend
    - platform
    - agent
    - llm
    - automation
    - llmops
    - mlops
    - agentic
    - inference
    - model
    - research
    - generative
  negative:
    - intern
    - director
    - vp
    - chief
    - president
    - legal
    - finance
    - accounting
    - recruiter
    - hr
    - janitor
    - cook
    - driver
  seniority_boost:
    - senior
    - staff
    - principal
    - lead
    - head of

search_queries:
  - query: "AI engineer remote"
    sources: [linkedin, indeed]
  - query: "LLM engineer python remote"
    sources: [linkedin, indeed]
  - query: "agentic AI automation python"
    sources: [linkedin, indeed]
  - query: "ML platform engineer remote"
    sources: [linkedin, indeed]
  - query: "LLMOps engineer observability"
    sources: [linkedin, indeed]
  - query: "AI forward deployed engineer"
    sources: [linkedin, indeed]
