[project]
name = "job-search-agent"
version = "0.1.0"
description = "Job Search Agent backend"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = [
    "frontend",
    "CVs",
    "data",
    "jobs_raw.json",
]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "F401"]
"__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
