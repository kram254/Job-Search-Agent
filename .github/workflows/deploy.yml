name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.ref }}
          check-name: "Build & dependency install"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 20
          allowed-conclusions: success

  deploy-render:
    name: Deploy backend to Render
    runs-on: ubuntu-latest
    needs: wait-for-ci
    environment:
      name: production
      url: https://job-search-backend.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL secret is not configured."
            echo "::warning::Add it under Settings > Secrets and variables > Actions."
            echo "::warning::Get the URL from Render dashboard > Service > Settings > Deploy Hook."
            exit 0
          fi
          echo "Triggering Render deploy..."
          response=$(curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "Response: $response"

      - name: Wait for deploy to complete
        if: env.RENDER_API_KEY != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Polling Render API for deploy status..."
          for i in $(seq 1 60); do
            status=$(curl -fsSL \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=1" \
              | python -c "import sys, json; d=json.load(sys.stdin); print(d[0]['deploy']['status'])")
            echo "[$i/60] status: $status"
            case "$status" in
              live) echo "Deploy live."; exit 0 ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Deploy ended with status: $status"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::warning::Deploy did not finish within 15 minutes; check Render dashboard."

  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: deploy-render
    steps:
      - name: Health check
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://job-search-backend.onrender.com' }}
        run: |
          echo "Waiting 30s for the new instance to warm up..."
          sleep 30
          for i in $(seq 1 10); do
            if curl -fsSL "$BACKEND_URL/health" | grep -q '"healthy"'; then
              echo "Health check passed."
              exit 0
            fi
            echo "[$i/10] not healthy yet, retrying in 15s..."
            sleep 15
          done
          echo "::error::Health endpoint did not return healthy after 10 attempts."
          exit 1
